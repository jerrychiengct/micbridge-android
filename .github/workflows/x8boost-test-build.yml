name: X8 Boost test APK

on:
  push:
    branches: [x8boost-test]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed test APK
        run: chmod +x ./build-x8boost.sh && ./build-x8boost.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X8Boost-0.1-test
          path: |
            dist/X8Boost-0.1-test.apk
            dist/X8Boost-0.1-test.apk.sha256
          if-no-files-found: error

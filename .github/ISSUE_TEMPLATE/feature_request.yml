name: Feature proposal
description: Suggest an improvement with a clear user benefit.
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Use case and alternatives
      description: Mention lectures, creative voices, hardware support or another specific use case.
  - type: textarea
    id: contribution
    attributes:
      label: Would you like to help implement or test it?
